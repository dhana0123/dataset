# Phase 3 stub — LLM LoRA on TSR (NOT fully implemented yet).
# Until then: TemplateLLM (offline) or live HF backends below.
#
# Language coverage:
#   A) sarvamai/sarvam-30b  — ALL 22 scheduled Indian langs (+ English)  ← use this
#   B) bharatgenai/Param2-17B-A2.4B-Thinking — English + 21 Indic (alt)
#   C) ai4bharat/Airavata (7B) — Hindi (+English) only; lighter L4 path
#
# Live inference without LoRA today:
#   python -m duplex_data.tsr.run ... --llm indic-22 --device cuda
#   python -m duplex_data.synthetic ... --llm-model indic-22

# Default Phase-3 target = 22-lang Sarvam MoE:
model_id: sarvamai/sarvam-30b
# model_id: bharatgenai/Param2-17B-A2.4B-Thinking
# model_id: ai4bharat/Airavata   # Hindi-only 7B
method: qlora
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, v_proj, k_proj, o_proj]
max_seq_len: 4096
data:
  train: ./tsr_train/llm_pairs.jsonl
  eval: ./tsr_train/llm_pairs_eval.jsonl
training:
  epochs: 2
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  bf16: true
notes: >
  Prefer sarvam-30b (indic-22) for Te/Ta/Kn/Hi and the other scheduled langs.
  Airavata is Hindi-only. Use TemplateLLM for offline tests.
  Aliases: indic-22 / sarvam-22 → sarvamai/sarvam-30b; param2 → Param2-17B.
